ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/app/web/public

    <Directory /var/www/app/web/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
